# ГОСТ Analyzer — локальный стек (DO-05 + DO-06 healthchecks)
# Сервисы: frontend, backend, doc-service, ml-service, db, ollama

services:
  db:
    image: postgres:16-alpine
    container_name: gost-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gost}
      POSTGRES_DB: ${POSTGRES_DB:-gost_analyzer}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gost} -d ${POSTGRES_DB:-gost_analyzer}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: gost-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: gost-backend
    environment:
      APP_NAME: Lab Formatter MVP
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gost}:${POSTGRES_PASSWORD:-gost}@db:5432/${POSTGRES_DB:-gost_analyzer}
      BACKEND_PUBLIC_URL: http://backend:8002
      DOC_SERVICE_BASE_URL: http://doc-service:8000
      ML_SERVICE_BASE_URL: http://ml-service:8001
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-change-me-in-dev}
      STORAGE_DIR: storage
      INPUT_DIR: storage/inputs
      OUTPUT_DIR: storage/outputs
      REPORT_DIR: storage/reports
      PROJECTS_DIR: storage/projects
    ports:
      - "8002:8002"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      doc-service:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  doc-service:
    build:
      context: ./doc-service
    container_name: gost-doc-service
    environment:
      PORT: "8000"
      SERVICE_URL: http://backend:8002
      ML_SERVICE_URL: http://ml-service:8001
    ports:
      - "8000:8000"
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/documents/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
    container_name: gost-ml-service
    environment:
      IMAGE_ANALYSIS_MODE: fast
      MAX_OCR_IMAGES: "0"
      ENABLE_IMAGE_AI: "false"
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      BACKEND_BASE_URL: http://backend:8002
    ports:
      - "8001:8001"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: gost-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  db_data:
  ollama_data:
  backend_storage:
